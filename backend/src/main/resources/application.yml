server:
  port: 8080

spring:
  application:
    name: gamehub-backend
  datasource:
    url: jdbc:h2:mem:gamehub;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.gamehub: INFO

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-gamehub-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash

gamehub:
  catalog:
    sync-on-startup: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
